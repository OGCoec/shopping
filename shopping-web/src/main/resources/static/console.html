<!DOCTYPE html>
<html lang="zh-CN" data-page-gate-mode="silent">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Console</title>
  <link rel="stylesheet" href="/shopping/css/page-access-gate.css?v=7" />
  <link rel="stylesheet" href="/shopping/css/console.css?v=3" />
</head>
<body>
  <div class="console-noomo-background" aria-hidden="true">
    <div class="console-noomo-background__wash"></div>
    <div class="console-noomo-background__dots"></div>
  </div>

  <main class="console-workspace" aria-label="商品控制台">
    <section class="console-toolbar">
      <form class="console-search-form" id="console-product-search-form">
        <a class="console-ghost-button" href="/shopping/user/orders">我的订单</a>
        <label class="console-field">
          <span>商品搜索</span>
          <input id="console-product-keyword" type="search" autocomplete="off" placeholder="搜索商品名称" />
        </label>
        <button class="console-primary-button" type="submit">搜索商品</button>
        <button class="console-ghost-button" id="console-product-search-clear" type="button">清空商品</button>
        <a class="console-ghost-button" href="/shopping/user/coupons">优惠券</a>
        <a class="console-ghost-button" href="/shopping/user/coupons/mine">我的券</a>
      </form>
      <button class="console-ghost-button" id="console-category-selection-clear" type="button">清空分类</button>
    </section>

    <section class="console-layout">
      <aside class="console-category-panel" aria-label="商品分类">
        <form class="console-category-search" id="console-category-search-form">
          <label class="console-field console-field--compact">
            <span>分类搜索</span>
            <input id="console-category-keyword" type="search" autocomplete="off" placeholder="搜索分类名称" />
          </label>
          <div class="console-category-actions">
            <button class="console-primary-button" type="submit">搜索</button>
            <button class="console-ghost-button" id="console-category-search-clear" type="button">清空</button>
          </div>
        </form>
        <div class="console-selected-category" id="console-selected-category" hidden></div>
        <div class="console-panel-status" id="console-category-status"></div>
        <nav class="console-category-tree" id="console-category-tree" aria-label="分类树"></nav>
      </aside>

      <section class="console-product-panel" aria-label="商品列表">
        <div class="console-product-header">
          <div>
            <h1>商品</h1>
            <p id="console-product-summary">正在加载商品</p>
          </div>
          <div class="console-pager" aria-label="商品分页">
            <button class="console-ghost-button" id="console-product-prev" type="button">上一页</button>
            <span id="console-product-page">1 / 1</span>
            <button class="console-ghost-button" id="console-product-next" type="button">下一页</button>
          </div>
        </div>
        <div class="console-panel-status" id="console-product-status"></div>
        <div class="console-product-grid" id="console-product-grid"></div>
      </section>
    </section>
  </main>

  <a class="console-avatar-link" id="console-avatar-link" href="/shopping/user/profile" aria-label="打开用户资料">
    <img id="console-avatar-image" alt="用户头像" hidden />
    <span id="console-avatar-fallback" aria-hidden="true"></span>
  </a>

  <script src="/shopping/js/security/security-urls.js?v=1"></script>
  <script src="/shopping/js/user/auth/shared/preauth-client.js?v=3"></script>
  <script src="/shopping/js/user/auth/shared/auth-client.js?v=3"></script>
  <script src="/shopping/js/user/auth/shared/page-access-gate.js?v=9"></script>
  <script src="/shopping/js/vendor/gsap.min.js"></script>
  <script src="/shopping/js/user/auth/console/console-noomo-background.js?v=4"></script>
  <script src="/shopping/js/user/auth/console/console-page.js?v=2"></script>
</body>
</html>
