<section class="admin-panel" data-admin-panel="ossAliyun">
  <div class="admin-api-detail">
    <button class="admin-api-back admin-spring-button" type="button" data-section-target="oss">返回 OSS</button>
    <div class="admin-oauth-config-card">
      <div class="admin-oauth-config-heading">
        <div class="admin-oauth-config-title">
          <span>Configuration</span>
          <strong>阿里云 OSS 配置</strong>
        </div>
        <div class="admin-oauth-config-tools">
          <button id="admin-aliyun-oss-config-load" class="admin-ghost-button admin-spring-button" type="button">查看配置</button>
        </div>
      </div>
      <p id="admin-aliyun-oss-config-status" class="admin-oauth-config-status">点击查看当前项目读取到的脱敏 accessKeyId 和 accessKeySecret。</p>
      <div id="admin-aliyun-oss-config-fields" class="admin-oauth-config-fields" hidden>
        <div class="admin-oauth-config-row">
          <span>accessKeyId</span>
          <div>
            <strong id="admin-aliyun-oss-access-key-id-value">-</strong>
            <small id="admin-aliyun-oss-access-key-id-meta">-</small>
          </div>
        </div>
        <div class="admin-oauth-config-row">
          <span>accessKeySecret</span>
          <div>
            <strong id="admin-aliyun-oss-access-key-secret-value">-</strong>
            <small id="admin-aliyun-oss-access-key-secret-meta">-</small>
          </div>
        </div>
      </div>
      <form id="admin-aliyun-oss-config-form" class="admin-oauth-config-form" hidden>
        <div class="admin-oauth-config-inputs">
          <label>
            <span>新的 accessKeyId</span>
            <input id="admin-aliyun-oss-access-key-id-input" type="text" autocomplete="off" placeholder="留空表示不修改" />
          </label>
          <label>
            <span>新的 accessKeySecret</span>
            <input id="admin-aliyun-oss-access-key-secret-input" type="password" autocomplete="new-password" placeholder="留空表示不修改" />
          </label>
        </div>
        <div class="admin-oauth-config-actions">
          <small>保存后写入 Windows 系统环境变量，需要后端以管理员身份运行，重启应用后 OSS 客户端生效。</small>
          <button id="admin-aliyun-oss-config-save" class="admin-ghost-button admin-spring-button" type="submit">保存修改</button>
        </div>
      </form>
    </div>
  </div>
</section>
