<section class="admin-panel" data-admin-panel="riskApiIping">
  <div class="admin-api-detail">
    <button class="admin-api-back admin-spring-button" type="button" data-section-target="ipRisk">返回 Risk API</button>
    <div class="admin-oauth-config-card admin-risk-api-config-card">
      <div class="admin-oauth-config-heading">
        <div class="admin-oauth-config-title">
          <span>Configuration</span>
          <strong>iPing 降级 API 配置</strong>
        </div>
        <div class="admin-oauth-config-tools">
          <button id="admin-risk-api-iping-config-load" class="admin-ghost-button admin-spring-button" type="button">查看配置</button>
        </div>
      </div>
      <p id="admin-risk-api-iping-config-status" class="admin-oauth-config-status">点击查看当前项目读取到的脱敏 iPing 降级 API 配置。</p>
      <div id="admin-risk-api-iping-config-fields" class="admin-oauth-config-fields" hidden></div>
      <form id="admin-risk-api-iping-config-form" class="admin-oauth-config-form" hidden>
        <div id="admin-risk-api-iping-config-inputs" class="admin-oauth-config-inputs"></div>
        <div class="admin-oauth-config-actions">
          <small>保存后写入 Windows 系统环境变量，需要后端以管理员身份运行，重启应用后 Risk API 客户端生效。</small>
          <button id="admin-risk-api-iping-config-save" class="admin-ghost-button admin-spring-button" type="submit">保存修改</button>
        </div>
      </form>
    </div>
  </div>
</section>
