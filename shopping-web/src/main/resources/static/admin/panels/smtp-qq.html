<section class="admin-panel" data-admin-panel="smtpQq">
  <div class="admin-api-detail">
    <button class="admin-api-back admin-spring-button" type="button" data-section-target="smtp">返回 SMTP</button>
    <div class="admin-oauth-config-card admin-smtp-config-card">
      <div class="admin-oauth-config-heading">
        <div class="admin-oauth-config-title">
          <span>Configuration</span>
          <strong>QQ 邮箱 SMTP 配置</strong>
        </div>
        <div class="admin-oauth-config-tools">
          <button id="admin-smtp-qq-config-load" class="admin-ghost-button admin-spring-button" type="button">查看配置</button>
        </div>
      </div>
      <p id="admin-smtp-qq-config-status" class="admin-oauth-config-status">点击查看当前项目读取到的 QQ 邮箱 SMTP 相关配置。</p>
      <div id="admin-smtp-qq-config-fields" class="admin-oauth-config-fields" hidden></div>
      <form id="admin-smtp-qq-config-form" class="admin-oauth-config-form" hidden>
        <div class="admin-oauth-config-inputs">
          <label>
            <span>新的 username</span>
            <input id="admin-smtp-qq-username-input" type="email" autocomplete="off" placeholder="留空表示不修改" />
          </label>
          <label>
            <span>新的 password</span>
            <input id="admin-smtp-qq-password-input" type="password" autocomplete="new-password" placeholder="留空表示不修改" />
          </label>
        </div>
        <div class="admin-oauth-config-actions">
          <small>保存后写入 Windows 系统环境变量，需要后端以管理员身份运行，重启应用后 SMTP 客户端生效。</small>
          <button id="admin-smtp-qq-config-save" class="admin-ghost-button admin-spring-button" type="submit">保存修改</button>
        </div>
      </form>
    </div>
  </div>
</section>
