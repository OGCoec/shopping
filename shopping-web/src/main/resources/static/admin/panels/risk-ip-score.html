<section class="admin-panel" data-admin-panel="riskIpScore">
  <div class="admin-api-detail admin-credit-score-detail">
    <button class="admin-api-back admin-spring-button" type="button" data-section-target="riskCreditScore">返回信用分管理</button>
    <div class="admin-service-grid" aria-label="IP 分数类型">
      <button class="admin-service-card admin-console-card" type="button" data-section-target="riskIpScoreIpv4">
        <span>IPv4</span>
        <strong>IPv4</strong>
        <small>IPv4 score</small>
      </button>
      <button class="admin-service-card admin-console-card" type="button" data-section-target="riskIpScoreIpv6">
        <span>IPv6</span>
        <strong>IPv6</strong>
        <small>IPv6 score</small>
      </button>
    </div>
    <div class="admin-risk-shortcut-bar">
      <span class="admin-risk-shortcut-label">快捷查看</span>
      <button class="admin-ghost-button admin-spring-button admin-risk-shortcut-btn" type="button" data-shortcut-family="ipv4" data-shortcut-level="L6" data-section-target="riskIpScoreIpv4">⚠ IPv4 L6 风险 IP</button>
      <button class="admin-ghost-button admin-spring-button admin-risk-shortcut-btn" type="button" data-shortcut-family="ipv6" data-shortcut-level="L6" data-section-target="riskIpScoreIpv6">⚠ IPv6 L6 风险 IP</button>
    </div>
  </div>
</section>
