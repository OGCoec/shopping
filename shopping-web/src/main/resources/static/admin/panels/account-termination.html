<section class="admin-panel" data-admin-panel="accountTermination">
  <div class="admin-api-detail admin-credit-score-detail">
    <button class="admin-api-back admin-spring-button" type="button" data-section-target="accountManagement">返回账号管理</button>
    <div class="admin-service-grid" aria-label="账号停用类型">
      <button class="admin-service-card admin-console-card" type="button" data-section-target="accountTerminationSelf">
        <span>Self disabled</span>
        <strong>主动停用管理</strong>
        <small>查看 7 天内可恢复和 7 天外主动停用记录</small>
      </button>
      <button class="admin-service-card admin-console-card" type="button" data-section-target="accountTerminationRisk">
        <span>Risk disabled</span>
        <strong>被动停用管理</strong>
        <small>查看风控封禁、L6 分数和违规封禁记录</small>
      </button>
    </div>
  </div>
</section>
