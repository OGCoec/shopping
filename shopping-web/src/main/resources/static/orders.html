<!DOCTYPE html>
<html lang="zh-CN" data-page-gate-mode="silent">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的订单</title>
  <link rel="stylesheet" href="/shopping/css/page-access-gate.css?v=7" />
  <link rel="stylesheet" href="/shopping/css/orders.css?v=3" />
</head>
<body>
  <div class="order-page-background" aria-hidden="true">
    <div class="order-page-background__wash"></div>
    <div class="order-page-background__dots"></div>
  </div>

  <main class="order-page" aria-label="我的订单">
    <header class="order-page-header">
      <a class="order-nav-button" href="/shopping/user/console">商品列表</a>
      <nav class="order-page-tabs" aria-label="订单导航">
        <a href="/shopping/user/orders" data-order-nav="orders">我的订单</a>
        <a href="/shopping/user/coupons/mine">我的优惠券</a>
      </nav>
      <a class="order-nav-button" href="/shopping/user/profile">个人资料</a>
    </header>

    <section class="order-status" id="order-page-status">正在加载订单</section>

    <section class="order-panel" id="order-list-view" hidden>
      <div class="order-panel-heading">
        <div>
          <h1>我的订单</h1>
          <p id="order-list-summary">-</p>
        </div>
      </div>

      <form class="order-filter-form" id="order-filter-form">
        <label>
          <span>订单状态</span>
          <select id="order-status-filter">
            <option value="">全部订单</option>
            <option value="STOCK_CONFIRMING">库存确认中</option>
            <option value="PENDING_PAYMENT">待支付</option>
            <option value="CLOSING">关闭确认中</option>
            <option value="PAID">已支付</option>
            <option value="CANCELLED">已取消</option>
            <option value="CLOSED">已关闭</option>
          </select>
        </label>
        <button class="order-primary-button" type="submit" data-action="filter-orders">筛选</button>
        <button class="order-ghost-button" id="order-filter-clear" type="button" data-action="clear-order-filter">清空</button>
      </form>

      <div class="order-list" id="order-list"></div>
      <div class="order-pager">
        <button class="order-ghost-button" id="order-prev" type="button" data-action="previous-page">上一页</button>
        <span id="order-page-indicator">1 / 1</span>
        <button class="order-ghost-button" id="order-next" type="button" data-action="next-page">下一页</button>
      </div>
    </section>

    <section class="order-panel" id="order-detail-view" hidden></section>
  </main>

  <script src="/shopping/js/security/security-urls.js?v=1"></script>
  <script src="/shopping/js/user/auth/shared/preauth-client.js?v=3"></script>
  <script src="/shopping/js/user/auth/shared/auth-client.js?v=3"></script>
  <script src="/shopping/js/user/auth/shared/page-access-gate.js?v=9"></script>
  <script src="/shopping/js/vendor/gsap.min.js"></script>
  <script src="/shopping/js/user/auth/console/console-noomo-background.js?v=4"></script>
  <script src="/shopping/js/user/orders/order-api.js?v=2"></script>
  <script src="/shopping/js/user/orders/orders-page.js?v=2"></script>
</body>
</html>
